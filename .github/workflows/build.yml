name: Docker Build

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly rebuild picks up PHP and Debian security patches in the base image
    - cron: '0 4 * * 1'

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ['1.43']
        type: [apache]

    steps:
    - uses: actions/checkout@v4
    - run: docker build --pull -f ./${{ matrix.version }}/${{ matrix.type }}/Dockerfile .
